<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zava Mapping — Gerador de Missões DJI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        :root {
            --bg-dark: #0b0b0b;
            --bg-panel: #141414;
            --bg-card: #1f1f1f;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --accent-gold: #c5a059;
            --accent-gold-hover: #d4af37;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --border-color: #2c2c2c;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); z-index: 1001; }
        .logo { font-size: 18px; font-weight: bold; color: var(--accent-gold); display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
        select.camera-select { background-color: var(--bg-card); color: white; border: 1px solid var(--accent-gold); padding: 8px 12px; border-radius: 6px; outline: none; cursor: pointer; font-weight: bold; }
        
        .container { display: flex; flex-grow: 1; height: calc(100% - 60px); position: relative; }
        #map { flex-grow: 1; height: 100%; z-index: 1; }
        
        .dashboard { position: absolute; left: 10px; top: 10px; bottom: 10px; width: 340px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; overflow-y: auto; padding-right: 5px; }
        .dashboard > * { pointer-events: auto; }
        .dashboard::-webkit-scrollbar { width: 6px; }
        .dashboard::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 4px; }
        
        .panel { background-color: rgba(20, 20, 20, 0.96); border-radius: 12px; padding: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.2); }
        .controls-header { font-size: 11px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; font-weight: bold; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
        .data-item { display: flex; flex-direction: column; background: var(--bg-card); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); }
        .data-item span:first-child { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .data-item span:last-child { font-size: 15px; font-weight: 600; color: #fff; }
        .data-item.full-width { grid-column: span 2; }
        
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; margin-top: 10px; }
        .control-row label { font-size: 13px; font-weight: 500; }
        .control-row span { font-size: 13px; color: var(--accent-gold); font-weight: bold; }
        
        .slider-container { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .slider-btn { width: 28px; height: 28px; background-color: var(--bg-card); border: 1px solid var(--accent-gold); border-radius: 6px; color: white; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .slider-btn:hover { background-color: var(--accent-gold); color: #000; }
        input[type="range"] { flex-grow: 1; appearance: none; height: 4px; background: #2c2c2c; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; background: var(--accent-gold); border-radius: 50%; cursor: pointer; }
        
        #advisor-panel { display: flex; flex-direction: column; gap: 8px; }
        .advice-card { padding: 10px; border-radius: 8px; font-size: 12px; display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; border-left: 4px solid; }
        .advice-success { background-color: rgba(34, 197, 94, 0.1); border-left-color: var(--accent-green); color: #bbf7d0; }
        .advice-warning { background-color: rgba(234, 179, 8, 0.1); border-left-color: var(--accent-yellow); color: #fef08a; }
        .advice-danger { background-color: rgba(239, 68, 68, 0.1); border-left-color: var(--accent-red); color: #fecaca; }
        
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-switch { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .3s; border-radius: 20px; }
        .slider-switch:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-switch { background-color: var(--accent-gold); }
        input:checked + .slider-switch:before { transform: translateX(16px); background: #000; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; margin-bottom: 8px; }
        .btn-gold { background-color: var(--accent-gold); color: #0b0b0b; }
        .btn-gold:hover { background-color: var(--accent-gold-hover); }
        .btn-transparent { background-color: var(--bg-card); color: white; border: 1px solid var(--accent-gold); }
        .btn-transparent:hover { background-color: rgba(197, 160, 89, 0.1); }
        .btn-row { display: flex; gap: 8px; }
        .file-input-wrapper { position: relative; flex: 1; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>❖</span> ZAVA MAPPING
        </div>
        <select class="camera-select" id="drone-selector" onchange="updateAll()">
            <option value="mini5_50">DJI Mini 5 Pro (50 MP)</option>
            <option value="mini5_12">DJI Mini 5 Pro (12 MP)</option>
            <option value="mini4_48">DJI Mini 4 Pro (48 MP)</option>
            <option value="mavic3e">DJI Mavic 3E (Mecânico)</option>
        </select>
    </header>

    <div class="container">
        <div class="dashboard">
            <div class="panel">
                <div class="controls-header">ANÁLISE E INTELIGÊNCIA</div>
                <div id="advisor-panel"></div>
            </div>

            <div class="panel">
                <div class="controls-header">DADOS DA MISSÃO</div>
                <div class="data-grid">
                    <div class="data-item">
                        <span>GSD (Qualidade)</span>
                        <span id="lbl-gsd">1.5 cm/px</span>
                    </div>
                    <div class="data-item">
                        <span>Total de Fotos</span>
                        <span id="lbl-photos">0</span>
                    </div>
                    <div class="data-item">
                        <span>Vel. de Borrão</span>
                        <span id="lbl-max-speed">5.3 m/s</span>
                    </div>
                    <div class="data-item">
                        <span>Tempo de Voo</span>
                        <span id="lbl-time">0m 0s</span>
                    </div>
                    <div class="data-item full-width" style="flex-direction: row; justify-content: space-between; align-items: center;">
                        <span style="font-size:13px; color:white;">Parar para Fotografar (Hover)</span>
                        <label class="switch">
                            <input type="checkbox" id="chk-hover" onchange="updateAll()">
                            <span class="slider-switch"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="controls-header">PARÂMETROS DE VOO</div>
                
                <div class="control-row"><label>Altitude (AGL)</label><span id="val-alt">80 m</span></div>
                <div class="slider-container">
                    <button class="slider-btn" onclick="adjSlider('slider-alt', -5)">-</button>
                    <input type="range" id="slider-alt" min="20" max="150" value="80" step="1" oninput="updateAll()">
                    <button class="slider-btn" onclick="adjSlider('slider-alt', 5)">+</button>
                </div>

                <div class="control-row"><label>Sobreposição Frontal</label><span id="val-front">75%</span></div>
                <div class="slider-container">
                    <button class="slider-btn" onclick="adjSlider('slider-front', -1)">-</button>
                    <input type="range" id="slider-front" min="40" max="90" value="75" oninput="updateAll()">
                    <button class="slider-btn" onclick="adjSlider('slider-front', 1)">+</button>
                </div>

                <div class="control-row"><label>Sobreposição Lateral</label><span id="val-side">70%</span></div>
                <div class="slider-container">
                    <button class="slider-btn" onclick="adjSlider('slider-side', -1)">-</button>
                    <input type="range" id="slider-side" min="40" max="90" value="70" oninput="updateAll()">
                    <button class="slider-btn" onclick="adjSlider('slider-side', 1)">+</button>
                </div>

                <div class="control-row"><label>Velocidade do Voo</label><span id="val-speed">9.4 m/s</span></div>
                <div class="slider-container">
                    <button class="slider-btn" onclick="adjSlider('slider-speed', -0.5)">-</button>
                    <input type="range" id="slider-speed" min="1" max="15" step="0.1" value="5.0" oninput="updateAll()">
                    <button class="slider-btn" onclick="adjSlider('slider-speed', 0.5)">+</button>
                </div>

                <div class="control-row"><label>Inclinação da Câmera</label><span id="val-cam-angle">90°</span></div>
                <div class="slider-container">
                    <button class="slider-btn" onclick="adjSlider('slider-cam-angle', -5)">-</button>
                    <input type="range" id="slider-cam-angle" min="45" max="90" value="90" step="5" oninput="updateAll()">
                    <button class="slider-btn" onclick="adjSlider('slider-cam-angle', 5)">+</button>
                </div>
                
                <div style="margin-top: 15px;">
                    <button class="btn btn-gold" onclick="exportDJIKMZ()">⬇ Exportar Missão WPML (DJI)</button>
                    <div class="btn-row">
                        <div class="file-input-wrapper">
                            <button class="btn btn-transparent" style="width:100%">🌍 Importar Área</button>
                            <input type="file" id="importKmz" accept=".kml,.kmz">
                        </div>
                        <button class="btn btn-transparent" style="flex:1;" onclick="clearMap()">🗑 Limpar</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        const dronesDB = {
            mini5_50: { name: "Mini 5 Pro (50MP)", w: 8192, h: 6144, gsdFactor: 0.01875, shutterMode: "electronic" },
            mini5_12: { name: "Mini 5 Pro (12MP)", w: 4096, h: 3072, gsdFactor: 0.0375, shutterMode: "electronic" },
            mini4_48: { name: "Mini 4 Pro (48MP)", w: 8064, h: 6048, gsdFactor: 0.019, shutterMode: "electronic" },
            mavic3e:  { name: "Mavic 3E", w: 5280, h: 3956, gsdFactor: 0.026, shutterMode: "mechanical" }
        };

        const map = L.map('map', { zoomControl: false }).setView([-16.6869, -49.2643], 15);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 22, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);
        const drawControl = new L.Control.Draw({ position: 'topright', edit: { featureGroup: drawnItems }, draw: { polygon: true, polyline: false, rectangle: false, marker: false, circle: false, circlemarker: false }});
        map.addControl(drawControl);

        let currentPolygonLayer = null;
        let routeLayer = L.featureGroup().addTo(map);
        let waypoints = [];
        let calculatedSpacingL = 0;
        let calculatedSpacingP = 0;

        map.on(L.Draw.Event.CREATED, function (e) {
            if(currentPolygonLayer) drawnItems.removeLayer(currentPolygonLayer);
            currentPolygonLayer = e.layer;
            currentPolygonLayer.setStyle({ color: '#c5a059', fillOpacity: 0.2 });
            drawnItems.addLayer(currentPolygonLayer);
            updateAll();
        });

        function adjSlider(id, val) {
            const el = document.getElementById(id);
            el.value = parseFloat(el.value) + val;
            updateAll();
        }

        function analyzeMapping(alt, front, side, speed, camAngle, maxBlurSpeed, gsd, hoverOn, drone) {
            const advisor = document.getElementById('advisor-panel');
            advisor.innerHTML = ''; 
            let issues = 0;

            if(gsd > 4.0) {
                addAdvice('warning', 'GSD Alto (> 4cm/px). Reduza a altitude para capturar mais detalhes do lote.');
                issues++;
            } else {
                addAdvice('success', `Qualidade ideal (${gsd.toFixed(1)}cm/px) para mapeamento de imóveis.`);
            }

            if(front < 70 || side < 60) {
                addAdvice('danger', 'Sobreposição insuficiente para costura perfeita no pós-processamento. Use mín. 70%.');
                issues++;
            } else {
                addAdvice('success', 'Níveis de sobreposição seguros e otimizados.');
            }

            if(!hoverOn && speed > maxBlurSpeed) {
                addAdvice('danger', `Velocidade (${speed}m/s) acima do limite contra borrões (${maxBlurSpeed.toFixed(1)}m/s). Ative o modo "Parar p/ Fotografar".`);
                issues++;
            } else if (hoverOn) {
                addAdvice('success', 'Modo Parada (Hover) Ativo: Nitidez máxima em cada disparo.');
            }

            if(issues === 0) {
                addAdvice('success', `Parâmetros perfeitamente calibrados para o ${drone.name}.`);
            }
        }

        function addAdvice(type, text) {
            const icons = { success: '✅', warning: '⚠️', danger: '🚨', info: '💡' };
            const div = document.createElement('div');
            div.className = `advice-card advice-${type}`;
            div.innerHTML = `<span>${icons[type]}</span> <div>${text}</div>`;
            document.getElementById('advisor-panel').appendChild(div);
        }

        function updateAll() {
            const droneKey = document.getElementById('drone-selector').value;
            const drone = dronesDB[droneKey];

            const alt = parseFloat(document.getElementById('slider-alt').value);
            const front = parseFloat(document.getElementById('slider-front').value);
            const side = parseFloat(document.getElementById('slider-side').value);
            const speed = parseFloat(document.getElementById('slider-speed').value);
            const camAngle = parseInt(document.getElementById('slider-cam-angle').value);
            const hoverOn = document.getElementById('chk-hover').checked;

            document.getElementById('val-alt').innerText = alt + " m";
            document.getElementById('val-front').innerText = front + "%";
            document.getElementById('val-side').innerText = side + "%";
            document.getElementById('val-speed').innerText = speed.toFixed(1) + " m/s";
            document.getElementById('val-cam-angle').innerText = camAngle + "°";

            const gsd = alt * drone.gsdFactor;
            const footW = drone.w * (gsd / 100); 
            const footH = drone.h * (gsd / 100); 

            calculatedSpacingL = footW * (1 - (side/100));
            calculatedSpacingP = footH * (1 - (front/100));
            const maxBlurSpeed = 350 * (gsd / 100);

            document.getElementById('lbl-gsd').innerText = gsd.toFixed(2) + " cm/px";
            document.getElementById('lbl-max-speed').innerText = maxBlurSpeed.toFixed(1) + " m/s";

            analyzeMapping(alt, front, side, speed, camAngle, maxBlurSpeed, gsd, hoverOn, drone);

            if(currentPolygonLayer) generateGrid(speed, hoverOn);
        }

        function generateGrid(speed, hoverOn) {
            routeLayer.clearLayers();
            waypoints = [];
            
            const geojson = currentPolygonLayer.toGeoJSON();
            const bbox = turf.bbox(geojson);
            const diagonal = turf.distance(turf.point([bbox[0], bbox[1]]), turf.point([bbox[2], bbox[3]]));
            const center = turf.center(geojson);
            
            const spL = calculatedSpacingL / 1000;
            const spP = calculatedSpacingP / 1000;
            
            const numLines = Math.ceil((diagonal * 1.5) / spL);
            let currentPoint = turf.destination(center, diagonal, 270);
            let toggle = true;

            for(let i=0; i<numLines; i++) {
                const p1 = turf.destination(currentPoint, diagonal*1.5, 270);
                const p2 = turf.destination(currentPoint, diagonal*1.5, 90);
                const line = turf.lineString([p1.geometry.coordinates, p2.geometry.coordinates]);
                
                let inters;
                try { inters = turf.lineIntersect(line, geojson); } catch(e) { continue; }

                if(inters.features.length >= 2) {
                     let pts = inters.features.map(f => f.geometry.coordinates);
                     pts.sort((a,b) => turf.distance(p1, turf.point(a)) - turf.distance(p1, turf.point(b)));
                     
                     let seg = [pts[0], pts[pts.length-1]];
                     if(!toggle) seg.reverse();
                     toggle = !toggle;
                     
                     const d = turf.distance(turf.point(seg[0]), turf.point(seg[1]));
                     const steps = Math.floor(d / spP);
                     for(let j=0; j<=steps; j++) {
                         const wp = turf.along(turf.lineString(seg), j * spP);
                         waypoints.push({lat: wp.geometry.coordinates[1], lng: wp.geometry.coordinates[0]});
                     }
                }
                currentPoint = turf.destination(currentPoint, spL, 0);
            }

            if(waypoints.length > 0) {
                const latlngs = waypoints.map(wp => [wp.lat, wp.lng]);
                L.polyline(latlngs, {color: '#c5a059', weight: 3}).addTo(routeLayer);
                waypoints.forEach((wp, i) => L.circleMarker([wp.lat, wp.lng], { radius: 3, fillColor: '#c5a059', color: '#000', weight: 1, fillOpacity: 1 }).addTo(routeLayer));

                let distKm = 0;
                for(let i=1; i<waypoints.length; i++) distKm += turf.distance(turf.point([waypoints[i-1].lng, waypoints[i-1].lat]), turf.point([waypoints[i].lng, waypoints[i].lat]));
                
                let timeSecs = (distKm * 1000) / speed;
                if(hoverOn) timeSecs += (waypoints.length * 2.5);
                
                document.getElementById('lbl-photos').innerText = waypoints.length;
                document.getElementById('lbl-time').innerText = `${Math.floor(timeSecs/60)}m ${Math.floor(timeSecs%60)}s`;
            }
        }

        document.getElementById('importKmz').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const kmlText = file.name.toLowerCase().endsWith('.kmz') ? await (await JSZip.loadAsync(file)).file(/.*\.kml|.*\.wpml/)[0].async('text') : await file.text();
            
            const ptsStr = new DOMParser().parseFromString(kmlText, "text/xml").getElementsByTagName('Polygon')[0]?.getElementsByTagName('coordinates')[0]?.textContent.trim();
            if(ptsStr) {
                const latLngs = ptsStr.split(/\s+/).map(p => p.split(',').map(Number)).filter(p => !isNaN(p[0])).map(p => [p[1], p[0]]);
                if(currentPolygonLayer) drawnItems.removeLayer(currentPolygonLayer);
                currentPolygonLayer = L.polygon(latLngs, { color: '#c5a059', fillOpacity: 0.2 }).addTo(drawnItems);
                map.fitBounds(currentPolygonLayer.getBounds());
                updateAll();
            }
            e.target.value = "";
        });

        function clearMap() { drawnItems.clearLayers(); routeLayer.clearLayers(); currentPolygonLayer = null; waypoints = []; updateAll(); }
        
        async function exportDJIKMZ() {
            if(waypoints.length === 0) return alert("Desenhe a área primeiro!");
            
            const height = document.getElementById('slider-alt').value;
            const speed = document.getElementById('slider-speed').value;
            const pitch = -document.getElementById('slider-cam-angle').value;
            const hoverCapture = document.getElementById('chk-hover').checked;
            
            let templateKml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:wpml="http://www.dji.com/wpmz/1.0.6">
  <Document>
    <wpml:author>Zava Mapping</wpml:author>
    <wpml:createTime>${Date.now()}</wpml:createTime>
    <wpml:updateTime>${Date.now()}</wpml:updateTime>
    <wpml:missionConfig>
      <wpml:flyToWaylineMode>safely</wpml:flyToWaylineMode>
      <wpml:finishAction>goHome</wpml:finishAction>
      <wpml:exitOnRCLost>executeLostAction</wpml:exitOnRCLost>
      <wpml:executeRCLostAction>goBack</wpml:executeRCLostAction>
      <wpml:takeOffSecurityHeight>${height}</wpml:takeOffSecurityHeight>
      <wpml:globalTransitionalSpeed>13</wpml:globalTransitionalSpeed>
      <wpml:droneInfo><wpml:droneEnumValue>343</wpml:droneEnumValue><wpml:droneSubEnumValue>0</wpml:droneSubEnumValue></wpml:droneInfo>
    </wpml:missionConfig>
    <Folder>
      <wpml:templateType>waypoint</wpml:templateType>
      <wpml:templateId>0</wpml:templateId>
      <wpml:globalHeight>${height}</wpml:globalHeight>
      <wpml:executeHeightMode>relativeToStartPoint</wpml:executeHeightMode>
      <wpml:waylineCoordinateSysParam><wpml:coordinateMode>WGS84</wpml:coordinateMode><wpml:heightMode>relativeToStartPoint</wpml:heightMode></wpml:waylineCoordinateSysParam>
      <wpml:autoFlightSpeed>${speed}</wpml:autoFlightSpeed>
      <wpml:gimbalPitchMode>manual</wpml:gimbalPitchMode>
      <wpml:globalWaypointTurnMode>coordinateTurn</wpml:globalWaypointTurnMode>
      <wpml:globalUseStraightLine>1</wpml:globalUseStraightLine>
    </Folder>
  </Document>
</kml>`;

            let placemarks = '';
            waypoints.forEach((wp, index) => {
                let actionGroup = '';
                if(index === 0) {
                    actionGroup = `<wpml:actionGroup><wpml:actionGroupId>${index}</wpml:actionGroupId><wpml:actionGroupStartIndex>${index}</wpml:actionGroupStartIndex><wpml:actionGroupEndIndex>${index}</wpml:actionGroupEndIndex><wpml:actionGroupMode>sequence</wpml:actionGroupMode><wpml:actionTrigger><wpml:actionTriggerType>reachPoint</wpml:actionTriggerType></wpml:actionTrigger><wpml:action><wpml:actionId>0</wpml:actionId><wpml:actionActuatorFunc>gimbalRotate</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:gimbalHeadingYawBase>aircraft</wpml:gimbalHeadingYawBase><wpml:gimbalRotateMode>absoluteAngle</wpml:gimbalRotateMode><wpml:gimbalPitchRotateEnable>1</wpml:gimbalPitchRotateEnable><wpml:gimbalPitchRotateAngle>${pitch}</wpml:gimbalPitchRotateAngle><wpml:gimbalRollRotateEnable>0</wpml:gimbalRollRotateEnable><wpml:gimbalRollRotateAngle>0</wpml:gimbalRollRotateAngle><wpml:gimbalYawRotateEnable>0</wpml:gimbalYawRotateEnable><wpml:gimbalYawRotateAngle>0</wpml:gimbalYawRotateAngle><wpml:payloadPositionIndex>0</wpml:payloadPositionIndex></wpml:actionActuatorFuncParam></wpml:action>${hoverCapture ? '<wpml:action><wpml:actionId>1</wpml:actionId><wpml:actionActuatorFunc>hover</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:hoverTime>2.5</wpml:hoverTime></wpml:actionActuatorFuncParam></wpml:action><wpml:action><wpml:actionId>2</wpml:actionId><wpml:actionActuatorFunc>takePhoto</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:payloadPositionIndex>0</wpml:payloadPositionIndex></wpml:actionActuatorFuncParam></wpml:action>' : '<wpml:action><wpml:actionId>1</wpml:actionId><wpml:actionActuatorFunc>takePhoto</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:payloadPositionIndex>0</wpml:payloadPositionIndex></wpml:actionActuatorFuncParam></wpml:action>'}</wpml:actionGroup>`;
                } else {
                    actionGroup = `<wpml:actionGroup><wpml:actionGroupId>${index}</wpml:actionGroupId><wpml:actionGroupStartIndex>${index}</wpml:actionGroupStartIndex><wpml:actionGroupEndIndex>${index}</wpml:actionGroupEndIndex><wpml:actionGroupMode>sequence</wpml:actionGroupMode><wpml:actionTrigger><wpml:actionTriggerType>reachPoint</wpml:actionTriggerType></wpml:actionTrigger>${hoverCapture ? '<wpml:action><wpml:actionId>0</wpml:actionId><wpml:actionActuatorFunc>hover</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:hoverTime>1.5</wpml:hoverTime></wpml:actionActuatorFuncParam></wpml:action><wpml:action><wpml:actionId>1</wpml:actionId><wpml:actionActuatorFunc>takePhoto</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:payloadPositionIndex>0</wpml:payloadPositionIndex></wpml:actionActuatorFuncParam></wpml:action>' : '<wpml:action><wpml:actionId>0</wpml:actionId><wpml:actionActuatorFunc>takePhoto</wpml:actionActuatorFunc><wpml:actionActuatorFuncParam><wpml:payloadPositionIndex>0</wpml:payloadPositionIndex></wpml:actionActuatorFuncParam></wpml:action>'}</wpml:actionGroup>`;
                }
                placemarks += `<Placemark><wpml:index>${index}</wpml:index><Point><coordinates>${wp.lng.toFixed(8)},${wp.lat.toFixed(8)},0</coordinates></Point><wpml:executeHeight>${parseFloat(height).toFixed(2)}</wpml:executeHeight><wpml:waypointSpeed>${speed}</wpml:waypointSpeed><wpml:waypointHeadingParam><wpml:waypointHeadingMode>followWayline</wpml:waypointHeadingMode><wpml:waypointHeadingAngle>0</wpml:waypointHeadingAngle></wpml:waypointHeadingParam><wpml:waypointTurnParam><wpml:waypointTurnMode>coordinateTurn</wpml:waypointTurnMode><wpml:waypointTurnDampingDist>0.2</wpml:waypointTurnDampingDist></wpml:waypointTurnParam>${actionGroup}</Placemark>`;
            });

            let waylinesWpml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:wpml="http://www.dji.com/wpmz/1.0.6">
  <Document>
    <wpml:missionConfig><wpml:flyToWaylineMode>safely</wpml:flyToWaylineMode><wpml:finishAction>goHome</wpml:finishAction><wpml:exitOnRCLost>executeLostAction</wpml:exitOnRCLost><wpml:executeRCLostAction>goBack</wpml:executeRCLostAction><wpml:takeOffSecurityHeight>${height}</wpml:takeOffSecurityHeight><wpml:globalTransitionalSpeed>13</wpml:globalTransitionalSpeed><wpml:droneInfo><wpml:droneEnumValue>343</wpml:droneEnumValue><wpml:droneSubEnumValue>0</wpml:droneSubEnumValue></wpml:droneInfo><wpml:payloadInfo><wpml:payloadEnumValue>0</wpml:payloadEnumValue><wpml:payloadSubEnumValue>0</wpml:payloadSubEnumValue><wpml:payloadPositionIndex>0</wpml:payloadPositionIndex></wpml:payloadInfo></wpml:missionConfig>
    <Folder><wpml:templateId>0</wpml:templateId><wpml:executeHeightMode>relativeToStartPoint</wpml:executeHeightMode><wpml:waylineId>0</wpml:waylineId><wpml:autoFlightSpeed>${speed}</wpml:autoFlightSpeed>${placemarks}</Folder>
  </Document>
</kml>`;

            const JSZipObj = new JSZip();
            JSZipObj.file("template.kml", templateKml);
            JSZipObj.file("waylines.wpml", waylinesWpml);

            const blob = await JSZipObj.generateAsync({type:"blob"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ZavaMapping_WP_${Date.now()}.kmz`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        setTimeout(updateAll, 500);
    </script>
</body>
